# nginx site for Bloogla. Get a certificate with: sudo certbot --nginx -d example.com
server {
    listen 80;
    server_name example.com;

    # Matches Bloogla's upload limit.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # Overwrite (don't append to) what the visitor sent, so they can't fake
        # their address and get around Bloogla's rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
