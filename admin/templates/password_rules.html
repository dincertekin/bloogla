{# Live strength bar and checklist under a new-password field
   (see /static/js/password.js). Needs `lang` and `password_rules`. #}
<div class="password-check" aria-live="polite">
    <div class="password-meter" aria-hidden="true">
        {% for rule in password_rules %}<span></span>{% endfor %}
    </div>
    <ul class="password-rules" aria-label="{{ lang.t("Your password needs:") }}">
        {% for rule in password_rules %}
        <li data-rule="{{ rule.id }}">
            <svg class="rule-icon" viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="7" />
                <path d="M5 8.2 7.1 10.3 11 6.2" />
            </svg>
            <span>{{ lang.t_owned(rule.text) }}</span>
        </li>
        {% endfor %}
    </ul>
</div>
