<!doctype html>
<html lang="{{ lang.code() }}">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:,">
    <title>{{ lang.t("Sign in") }}</title>
    <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body>
    <main class="container" style="max-width: 420px; margin-top: 8vh; padding: 0 1rem;">
        <a href="/" class="btn btn-ghost btn-sm" style="margin-bottom: 1.5rem">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6" />
            </svg>
            {{ lang.t("Back to Home") }}
        </a>

        <div class="card">
            <h1 class="auth-title">{{ lang.t("Sign in") }}</h1>

            {% if let Some(notice) = notice %}
            <p class="alert alert-success" role="status">{{ notice }}</p>
            {% endif %}

            {% if let Some(err) = error %}
            <p class="error-message" role="alert" style="text-align: center; font-weight: 500">
                {{ err }}
            </p>
            {% endif %}

            <form method="POST" action="/admin/login">
                <div class="form-group">
                    <label for="email">{{ lang.t("Email") }}</label>
                    <input type="email" id="email" name="email" class="form-control" required
                        placeholder="admin@bloogla.com" autocomplete="username" autocapitalize="off" autocorrect="off"
                        autofocus />
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem">
                    <div class="label-row">
                        <label for="password">{{ lang.t("Password") }}</label>
                        <a href="/admin/forgot-password" class="form-hint">{{ lang.t("Forgot password?") }}</a>
                    </div>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••"
                        autocomplete="current-password" required />
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%">
                    {{ lang.t("Sign in") }}
                </button>
            </form>
        </div>
    </main>
    <script src="/static/js/admin.js"></script>
</body>

</html>
