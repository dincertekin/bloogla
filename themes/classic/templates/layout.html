<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ blog_name }}{% endblock %}</title>
    <link rel="stylesheet" href="/theme-assets/classic/static/css/style.css" />
    <link rel="stylesheet" href="/theme-assets/classic/static/css/prism-material-light.min.css" />
    {% block extra_head %}{% endblock %}
</head>

<body>
    {% include "classic/templates/header.html" %}

    <main class="container main-content">
        {% block content %}{% endblock %}
    </main>

    {% include "classic/templates/footer.html" %}

    {% block scripts %}
    <script src="/theme-assets/classic/static/js/prism.min.js"></script>
    <script src="/theme-assets/classic/static/js/prism-autoloader.min.js"></script>
    {% endblock %}
</body>

</html>
