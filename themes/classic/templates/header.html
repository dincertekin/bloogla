<header class="site-header">
    <div class="header-left">
        <a href="/" class="brand">{{ blog_name }}</a>
        <nav class="main-nav">
            <a href="/" class="btn btn-ghost btn-sm">Home</a>
            {% if tags %}
            <div class="dropdown">
                <button type="button" class="btn btn-ghost btn-sm">
                    Tags
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="m6 9 6 6 6-6" />
                    </svg>
                </button>
                <div class="dropdown-menu">
                    {% for tag in tags %}
                    <a href="/tag/{{ tag.slug }}" class="dropdown-item">{{ tag.name }}</a>
                    {% endfor %}
                </div>
            </div>
            {% endif %}
        </nav>
    </div>

    <div class="header-center">
        <form action="/search" method="GET" class="search-form">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" name="q" value="{{ search_query | default(value='') }}"
                placeholder="Search articles, tags, keywords..." class="form-control search-input" />
        </form>
    </div>

    <div class="header-right">
        <a href="/admin" class="btn btn-primary btn-sm">Log In</a>
    </div>
</header>
