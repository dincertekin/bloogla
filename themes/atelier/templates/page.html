{% extends "templates/layout.html" %}

{% block title %}{{ post.title }} - {{ blog_name }}{% endblock %}

{% block content %}
<article class="single">
    <header class="single-header">
        <h1 class="single-title">{{ post.title }}</h1>
    </header>

    {% if post.cover_image %}
    <img src="{{ post.cover_image }}" alt="" class="single-cover" decoding="async" fetchpriority="high"
        {% if post.cover_width %}width="{{ post.cover_width }}" height="{{ post.cover_height }}"{% endif %}
        {% if post.cover_small %}srcset="{{ post.cover_small }} 800w, {{ post.cover_image }} {{ post.cover_width }}w" sizes="(max-width: 760px) 100vw, 704px"{% endif %} />
    {% endif %}

    <div class="post-body">
        {{ content_html | safe }}
    </div>
</article>
{% endblock %}
