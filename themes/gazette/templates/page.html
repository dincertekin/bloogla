{% extends "templates/layout.html" %}

{% block title %}{{ post.title }} - {{ blog_name }}{% endblock %}

{% block content %}
<article class="article">
    <header class="article-header">
        <h1 class="article-title">{{ post.title }}</h1>
    </header>

    {% if post.cover_image %}
    <img src="{{ post.cover_image }}" alt="" class="article-cover" decoding="async" fetchpriority="high"
        {% if post.cover_width %}width="{{ post.cover_width }}" height="{{ post.cover_height }}"{% endif %}
        {% if post.cover_small %}srcset="{{ post.cover_small }} 800w, {{ post.cover_image }} {{ post.cover_width }}w" sizes="(max-width: 1000px) calc(100vw - 2.5rem), 960px"{% endif %} />
    {% endif %}

    <div class="post-body">
        {{ content_html | safe }}
    </div>
</article>
{% endblock %}
