name = "Story"
author = "Bloogla Team"
version = "1.0.0"
description = "A calm reading theme in the style of Medium: big sans-serif titles, a serif text column and a feed with thumbnails."
preview_image = "static/preview.svg"

# Shown in Admin → Appearance; templates read them as theme_options.<name>.
[[options]]
name = "accent_color"
label = "Accent color"
type = "color"
default = "#1a8917"
hint = "Used for links, buttons and highlights."

[[options]]
name = "footer_text"
label = "Footer text"
type = "text"
default = ""
hint = "Shown at the bottom of every page. Leave empty to show © and the site name."

[[options]]
name = "show_powered_by"
label = "Show “Powered by Bloogla”"
type = "checkbox"
default = true
