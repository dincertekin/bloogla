{% extends "templates/layout.html" %}

{% block title %}{{ t.page_not_found }} - {{ blog_name }}{% endblock %}

{% block content %}
<section class="story not-found">
    <p class="not-found-code">404</p>
    <h1 class="story-title">{{ t.page_not_found }}</h1>
    <p class="empty-state">{{ t.the_page_you_are_looking_for }}</p>
    <a href="/" class="button">{{ t.back_to_all_posts }}</a>
</section>
{% endblock %}
