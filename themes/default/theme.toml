name = "Default Theme"
author = "Bloogla Team"
version = "2.3.0"
description = "Clean, fast default theme for Bloogla, with dark mode."

# Shown in Admin → Themes → Customize; templates read them as theme_options.<name>.
[[options]]
name = "accent_color"
label = "Accent color"
type = "color"
default = "#2563eb"
hint = "Used for links, buttons and highlights."

[[options]]
name = "footer_text"
label = "Footer text"
type = "text"
default = ""
hint = "Shown at the bottom of every page. Leave empty to show © and the site name."

[[options]]
name = "show_powered_by"
label = "Show “Powered by Bloogla”"
type = "checkbox"
default = true
