name: Release

# Push a version tag (git tag v1.0.0 && git push --tags) to:
# - build Bloogla for Linux servers (x86_64 and ARM), sign each program with
#   the release signing key (repository secret BLOOGLA_SIGNING_KEY, see the
#   README's "Releasing"), and attach them to a new GitHub release with the
#   list of changes. Sites find it in Settings → Updates and can install it;
#   they only accept programs with a valid signature (src/services/updates.rs);
# - publish the Docker image ghcr.io/<owner>/bloogla:<version> and :latest,
#   so people can run Bloogla without building it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  programs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: bloogla-x86_64-linux
          - target: aarch64-unknown-linux-musl
            asset: bloogla-aarch64-linux
    steps:
      - uses: actions/checkout@v4
      # Sites check that the program they download says this version, so the
      # tag and Cargo.toml must agree.
      - name: Check the version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
      # Static programs (musl) run on any Linux server.
      - run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.BLOOGLA_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "Add the BLOOGLA_SIGNING_KEY secret (see README, Releasing)"; exit 1; }
          cp target/${{ matrix.target }}/release/bloogla ${{ matrix.asset }}
          # The signature covers "bloogla <version> <asset>" + the program, so it
          # only fits this release (see signed_message in src/services/updates.rs).
          { printf 'bloogla %s %s\n' "${GITHUB_REF_NAME#v}" "${{ matrix.asset }}"; cat ${{ matrix.asset }}; } > signed
          printf '%s\n' "$SIGNING_KEY" > key.pem
          openssl pkeyutl -sign -inkey key.pem -rawin -in signed -out ${{ matrix.asset }}.sig
          rm key.pem signed
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}*

  github-release:
    needs: programs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: programs
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" programs/* --verify-tag --generate-notes --title "Bloogla ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
