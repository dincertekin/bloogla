name: Release

# Push a version tag (git tag v1.0.0 && git push --tags) to:
# - build Bloogla for Linux servers (x86_64 and ARM), Windows and Macs
#   (Apple Silicon and Intel), sign each program with the release signing
#   key (repository secret BLOOGLA_SIGNING_KEY, see CONTRIBUTING.md,
#   "Releasing"), and attach them to a new GitHub release with the list of
#   changes. Sites find it in Settings → Updates and can install it; they only
#   accept programs with a valid signature (src/services/updates.rs);
# - publish the Docker image ghcr.io/<owner>/bloogla:<version> and :latest
#   for Intel/AMD and ARM, so people can run Bloogla without building it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # A draft release first: the programs are added to it, and it's only
  # published (visible to people and to Settings → Updates) once all are
  # there and signed.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sites check that the program they download says this version, so the
      # tag and Cargo.toml must agree.
      - name: Check the version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"; exit 1; }
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A draft left by an earlier, failed run is reused.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "Bloogla ${GITHUB_REF_NAME#v}"

  programs:
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static Linux programs (musl) run on any Linux server.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: bloogla-x86_64-linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: bloogla-aarch64-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: bloogla-x86_64-windows.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: bloogla-aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: bloogla-x86_64-macos
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-zigbuild
      - name: Build (Linux, with Zig for static programs)
        if: runner.os == 'Linux'
        run: |
          pip3 install --quiet ziglang
          cargo zigbuild --release --target ${{ matrix.target }}
      - name: Build (Windows and Mac)
        if: runner.os != 'Linux'
        env:
          # Windows: put the C runtime inside the .exe, so it runs on computers
          # without Visual Studio's runtime ("VCRUNTIME140.dll is missing").
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Add the program to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=target/${{ matrix.target }}/release/bloogla
          if [ -f "$built.exe" ]; then built="$built.exe"; fi
          cp "$built" ${{ matrix.asset }}
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.asset }} --clobber

  publish:
    needs: programs
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the programs
        run: gh release download "$GITHUB_REF_NAME" --pattern 'bloogla-*' --dir programs --clobber
      # Each signature covers "bloogla <version> <asset>" + the program, so it
      # only fits this release (see signed_message in src/services/updates.rs).
      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.BLOOGLA_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "Add the BLOOGLA_SIGNING_KEY secret (see CONTRIBUTING.md, Releasing)"; exit 1; }
          printf '%s\n' "$SIGNING_KEY" > key.pem
          cd programs
          rm -f ./*.sig ./*.zip
          for asset in bloogla-*; do
            { printf 'bloogla %s %s\n' "${GITHUB_REF_NAME#v}" "$asset"; cat "$asset"; } > ../signed
            openssl pkeyutl -sign -inkey ../key.pem -rawin -in ../signed -out "$asset.sig"
          done
          cd ..
          rm key.pem signed
      # Macs: a downloaded program isn't marked runnable, so double-clicking it
      # would open a text editor. A .zip keeps the mark (Safari unzips it).
      # The updater uses the plain, signed files.
      - name: Zip the Mac programs
        run: |
          for asset in programs/bloogla-*-macos; do
            dir=$(mktemp -d)
            cp "$asset" "$dir/bloogla"
            chmod +x "$dir/bloogla"
            (cd "$dir" && zip -q -X "$OLDPWD/$asset.zip" bloogla)
          done
          ls -l programs
      - name: Publish the release
        run: |
          gh release upload "$GITHUB_REF_NAME" programs/*.sig programs/*.zip --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  # The Docker image, for Intel/AMD and ARM, made from the release's own
  # Linux programs (so it's quick to build and matches the downloads).
  image:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the Linux programs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern 'bloogla-*-linux' --dir downloads
          mkdir -p image/amd64 image/arm64 image/app
          cp downloads/bloogla-x86_64-linux image/amd64/bloogla
          cp downloads/bloogla-aarch64-linux image/arm64/bloogla
          cp .github/release.Dockerfile image/Dockerfile
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
