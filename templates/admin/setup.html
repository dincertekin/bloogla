<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Set up your site</title>
    <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body>
    <main class="container" style="max-width: 460px; margin: 8vh auto 4rem; padding: 0 1rem;">
        <p class="text-secondary" style="text-align: center; font-weight: 600; margin-bottom: 1rem">Bloogla</p>

        <div class="card">
            <h1 style="font-size: 1.375rem; font-weight: 700; margin-bottom: 0.35rem">Set up your site</h1>
            <p class="text-secondary" style="margin-bottom: 1.5rem; font-size: 0.9rem">
                Pick a title and create the account you'll use to write. You can change all of this later.
            </p>

            {% if let Some(err) = error %}
            <div class="alert alert-error" role="alert">{{ err }}</div>
            {% endif %}

            <form method="POST" action="/setup">
                <div class="form-group">
                    <label for="blog_name">Site title</label>
                    <input type="text" id="blog_name" name="blog_name" class="form-control" required
                        value="{{ blog_name }}" placeholder="My Blog" autofocus />
                </div>

                <div class="form-group">
                    <label for="email">Your email</label>
                    <input type="email" id="email" name="email" class="form-control" required value="{{ email }}"
                        autocomplete="username" />
                    <span class="form-hint">Used to sign in. It isn't shown on your site.</span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" minlength="8"
                        autocomplete="new-password" required />
                    <span class="form-hint">At least 8 characters.</span>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem">
                    <label for="confirm_password">Repeat password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                        minlength="8" autocomplete="new-password" required />
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%">Create My Site</button>
            </form>
        </div>
    </main>
</body>

</html>
