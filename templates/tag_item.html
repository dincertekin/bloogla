<div class="card" id="tag-{{ tag.id }}" style="
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.85rem 1.25rem;
        margin-bottom: 0.5rem;
    ">
    <div>
        <strong style="
                color: var(--text-primary);
                font-weight: 600;
                font-size: 0.95rem;
            ">
            {{ tag.name }}
        </strong>
    </div>
    <div>
        <button type="button" class="btn btn-danger btn-sm" onclick="openDeleteModal('{{ tag.id }}')">
            Delete
        </button>
    </div>
</div>
