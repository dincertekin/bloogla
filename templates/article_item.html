<div class="article-item" id="article-{{ article.id }}">
    <div class="article-info">
        {% if let Some(cover) = article.cover_image %}
        <img
            src="{{ cover }}"
            alt="{{ article.title }}"
            class="article-cover-preview"
        />
        {% else %}
        <div class="article-cover-preview no-img-placeholder">No Img</div>
        {% endif %}
        <div>
            <strong>{{ article.title }}</strong>
            <div class="article-meta">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
                {{ article.views }} views
            </div>
            {% if !article.tags.is_empty() %}
            <div class="article-tags">
                {% for tag in article.tags %}
                <span class="tag-chip">{{ tag.name }}</span>
                {% endfor %}
            </div>
            {% endif %}
        </div>
    </div>
    <div>
        <a href="/admin/articles/{{ article.id }}/edit" class="link-edit"
            >Edit</a
        >
        <button
            type="button"
            class="btn-delete"
            hx-delete="/admin/articles/{{ article.id }}"
            hx-target="#article-{{ article.id }}"
            hx-swap="delete"
            hx-confirm="Are you sure you want to delete this article?"
        >
            Delete
        </button>
    </div>
</div>
