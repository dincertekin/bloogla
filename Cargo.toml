[package]
name = "bloogla"
version = "1.1.0"
edition = "2021"
description = "A fast, single-binary blog engine and CMS: a modern WordPress alternative."
repository = "https://github.com/dincertekin/bloogla"
license = "MIT"
readme = "README.md"

[dependencies]
# Web server
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12", features = ["form"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tower-http = { version = "0.5", features = ["catch-panic", "compression-br", "compression-gzip", "fs", "set-header"] }
# Login rate limit; only its axum part (the default also pulls in gRPC)
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
tower-sessions = { version = "0.14", default-features = false, features = ["axum-core"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }

# Built-in HTTPS (Let's Encrypt)
axum-server = "0.8"
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "webpki-roots", "axum"] }
futures-util = "0.3"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# Templates: askama for the admin panel (compiled in), tera for themes (loaded at runtime)
askama = "0.12"
# Stay on Tera 1: Tera 2 changes the template language and would break
# existing themes.
tera = "1.19"

# Content: Markdown, HTML sanitizing, images
comrak = { version = "0.18", default-features = false }
ammonia = "4.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Smaller WebP copies of uploaded photos (Google's libwebp, built from source):
# lossy for JPEG photos, lossless for PNG. The image crate above can only write
# lossless WebP, which is bigger than JPEG for photos.
webp = { version = "0.3", default-features = false }
# Backups you can download and restore: one .zip, stored without compression
# (photos are already compressed), streamed from disk. Restoring also reads
# compressed ones (a backup re-zipped on a computer); flate2 is already used
# for page compression, so this adds nothing new.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
tokio-util = { version = "0.7", features = ["io"] }

# Security: password hashing, random tokens, encrypting
# stored secrets, two-factor codes
argon2 = { version = "0.5", features = ["password-hash"] }
chacha20poly1305 = "0.11"
hmac = "0.12"
sha1 = "0.11"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
sha2 = "0.10"

# Email
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }

# Updates: asking GitHub for the latest release and downloading it (reuses
# the rustls/ring/webpki-roots that HTTPS and email already use), and
# checking the download's signature with ring
ureq = { version = "3", default-features = false, features = ["rustls"] }
ring = "0.17"

# Data formats, files embedded in the binary, dates
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rust-embed = { version = "8", features = ["include-exclude", "mime-guess"] }
chrono = { version = "0.4", features = ["serde"] }
# Time zones, so dates show (and are entered) in the site's local time
chrono-tz = "0.10"

# Command line and logging
dialoguer = { version = "0.11", default-features = false, features = ["password"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

[dev-dependencies]
# Sending requests to the app in tests without starting a server.
tower = { version = "0.5", features = ["util"] }

# Password hashing is slow on purpose; unoptimized (debug) builds make it
# painfully slow, so it's optimized even in `cargo run` and `cargo test`.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Proc-macros (sqlx, askama...) are loaded by the compiler. Stripping them
# corrupts the dylib on recent macOS ("mis-aligned LINKEDIT string pool").
[profile.release.build-override]
strip = false
