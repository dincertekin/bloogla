services:
  bloogla:
    build: .
    container_name: bloogla_cms
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=sqlite:///app/data/bloogla.db?mode=rwc
      - RUST_LOG=info
      - BASE_URL=https://yourdomain.com
