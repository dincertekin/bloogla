# Settings for `cargo audit` (run in CI).
[advisories]
ignore = [
    # rsa "Marvin attack": rsa is only listed in Cargo.lock as an optional part
    # of sqlx's MySQL driver. Bloogla uses SQLite, so rsa is never compiled
    # (`cargo tree -i rsa` prints nothing). Re-check when upgrading sqlx.
    "RUSTSEC-2023-0071",
    # webpki-roots 0.26 (via rustls-acme, for built-in HTTPS) holds no
    # certificates of its own: its code is only `pub use parent::TLS_SERVER_ROOTS`
    # from webpki-roots 1.x, which is 1.0.10 or newer in Cargo.lock (the fixed
    # list). Re-check when rustls-acme moves to webpki-roots 1.
    "RUSTSEC-2026-0381",
    # SQLite before 3.54 (bundled by libsqlite3-sys before 0.39) can return
    # stale memory when it opens a database together with a crafted `-wal`
    # file beside it. Bloogla only opens its own data/bloogla.db; Restore
    # takes nothing from a backup but bloogla.db and uploads/ (never a -wal)
    # and deletes the old -wal and -shm before putting it in place
    # (src/services/restore.rs). No sqlx release allows libsqlite3-sys 0.39
    # yet (sqlx 0.9 stops below 0.38). Remove when sqlx and
    # tower-sessions-sqlx-store do.
    "RUSTSEC-2026-0459",
]
